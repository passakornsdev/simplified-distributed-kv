events { }

http {
    upstream distributed_store_nodes {
        server node1:8080;
        server node2:8080;
        server node3:8080;
        server node4:8080;
        server node5:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://distributed_store_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

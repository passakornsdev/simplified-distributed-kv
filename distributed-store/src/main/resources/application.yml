spring:
  application:
    name: distributed-store
  profiles:
    active: ${env:local}

kv:
  node-id: ${nodeId:distributed-store-0}
  ring:
    virtual-nodes: 128
  membership:
    self-url: ${selfUrl:http://distributed-store-0.distributed-store:8080}
    seed-urls: ${seedUrls:}
    gossip-interval-ms: 5000
  replication:
    n: 3
    w: 2
    r: 2
  client:
    timeout-ms: 500
  read-repair:
    enabled: true

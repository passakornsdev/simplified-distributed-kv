apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distributed-store
spec:
  serviceName: distributed-store
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: distributed-store
  template:
    metadata:
      labels:
        app: distributed-store
    spec:
      containers:
        - name: distributed-store
          image: distributed-store:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_APPLICATION_JSON
              value: >-
                {"kv":{"node-id":"${POD_NAME}","membership":{"self-url":"http://${POD_NAME}.distributed-store:8080","seed-urls":["http://distributed-store-0.distributed-store:8080","http://distributed-store-1.distributed-store:8080","http://distributed-store-2.distributed-store:8080"]}}}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /internal/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /internal/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-store
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: distributed-store
  ports:
    - name: http
      port: 8080
      targetPort: 8080

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distributed-store
spec:
  serviceName: distributed-store
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: distributed-store
  template:
    metadata:
      labels:
        app: distributed-store
    spec:
      containers:
        - name: distributed-store
          image: distributed-store:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /internal/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /internal/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-store
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: distributed-store
  ports:
    - name: http
      port: 8080
      targetPort: 8080

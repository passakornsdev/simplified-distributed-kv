apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-store
spec:
  selector:
    matchLabels:
      app: distributed-store
  template:
    metadata:
      labels:
        app: distributed-store
    spec:
      containers:
        - name: distributed-store
          image: distributed-store:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /internal/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /internal/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-store
spec:
  selector:
    app: distributed-store
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: distributed-store
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: distributed-store
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
